<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>VIVO V80 Grand Launch - Lucky Draw</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background: radial-gradient(ellipse at center, #0a1a4a 0%, #050a1f 50%, #000000 100%);
    color: #ffffff;
  }

  /* Floating background particles */
  .bg-particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    background: radial-gradient(circle, rgba(0,212,255,0.6), transparent 70%);
    border-radius: 50%;
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* Main Layout */
  .led-wall {
    position: relative;
    z-index: 1;
    width: 100vw;
    min-height: 100vh;
    display: grid;
    grid-template-rows: 15vh 1fr auto;
    padding: 2vh 2vw;
    gap: 2vh;
  }

  /* TOP BAR */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 3vw;
    background: linear-gradient(90deg, rgba(0,212,255,0.1), rgba(255,255,255,0.05), rgba(0,212,255,0.1));
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    backdrop-filter: blur(10px);
  }

  .vivo-logo {
    font-size: 6vh;
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(180deg, #ffffff 0%, #00d4ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .launch-title { text-align: center; }

  .launch-title h1 {
    font-size: 5.6vh;
    font-weight: 900;
    letter-spacing: 5px;
    background: linear-gradient(90deg, #ffcc00, #ffffff, #ffcc00);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    animation: shine 3s linear infinite;
  }

  .launch-title .tagline {
    font-size: 2.5vh;
    color: #b0c4ff;
    letter-spacing: 3px;
    margin-top: 0.5vh;
  }

  @keyframes shine { to { background-position: 200% center; } }

  /* CENTER STAGE (3 Columns for Desktop/LED) */
  .center-stage {
    display: grid;
    grid-template-columns: 30fr 40fr 30fr;
    gap: 2vw;
    align-items: center;
  }

  /* LEFT: Product Image */
  .product-panel {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    overflow: hidden;
    backdrop-filter: blur(10px);
  }

  .product-panel::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: conic-gradient(from 0deg, transparent, #ffcc00, transparent 30%);
    border-radius: 24px;
    z-index: -1;
    animation: rotate 6s linear infinite;
    opacity: 0.4;
  }

  .product-image {
    max-width: 55%;
    max-height: 70%;
    object-fit: contain;
    filter: drop-shadow(0 0 40px rgba(255,204,0,0.4));
    animation: floatPhone 4s ease-in-out infinite;
  }

  @keyframes floatPhone {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .product-fallback {
    text-align: center;
    padding: 20px;
    display: none;
  }

  .product-fallback .model {
    font-size: 6vh;
    font-weight: 900;
    background: linear-gradient(180deg, #ffcc00, #ff6b6b);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .product-fallback .sub {
    font-size: 2.5vh;
    color: #b0c4ff;
    letter-spacing: 2px;
    margin-top: 1vh;
  }

  /* CENTER: Number Display */
  .number-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vh;
  }

  .draw-label {
    font-size: 3vh;
    letter-spacing: 6px;
    color: #8aa0d0;
    text-transform: uppercase;
    font-weight: 700;
  }

  .number-stage {
    position: relative;
    width: 40vh;
    height: 40vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glow-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #00d4ff, #0066ff, #ff00aa, #ffcc00, #00d4ff);
    padding: 6px;
    animation: rotate 4s linear infinite;
    box-shadow: 0 0 80px rgba(0,212,255,0.6), 0 0 160px rgba(0,102,255,0.4);
  }

  @keyframes rotate { to { transform: rotate(360deg); } }

  .glow-ring-inner {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 30% 30%, #0a1a4a, #000);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .number-display {
    font-size: 20vh;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #00d4ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 6px;
    font-variant-numeric: tabular-nums;
  }

  .number-display.rolling { animation: shake 0.08s infinite; }
  .number-display.winner { animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; filter: blur(10px); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; filter: blur(0); }
  }

  /* RIGHT: Winner Announcement */
  .winner-panel {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, rgba(255,204,0,0.08), rgba(255,107,107,0.05));
    border: 2px solid rgba(255,204,0,0.2);
    border-radius: 24px;
    padding: 3vh;
    text-align: center;
    backdrop-filter: blur(10px);
    opacity: 0.2;
    transition: all 0.6s;
  }

  .winner-panel.show {
    opacity: 1;
    animation: glowPulse 2s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 40px rgba(255,204,0,0.3); border-color: rgba(255,204,0,0.4); }
    50% { box-shadow: 0 0 80px rgba(255,204,0,0.6); border-color: rgba(255,204,0,0.8); }
  }

  .congrats-text {
    font-size: 4vh;
    font-weight: 900;
    background: linear-gradient(90deg, #ffcc00, #ffffff, #ffcc00);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    animation: shine 2s linear infinite;
    letter-spacing: 2px;
    line-height: 1.2;
    margin-bottom: 3vh;
  }

  .lucky-number-label {
    font-size: 3vh;
    color: #b0c4ff;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 1vh;
  }

  .lucky-number-value {
    font-size: 14vh;
    font-weight: 900;
    background: linear-gradient(180deg, #ffcc00 0%, #ff6b6b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 8px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  /* BOTTOM BAR */
  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3vw;
    padding-bottom: 2vh;
  }

  .play-btn {
    background: linear-gradient(135deg, #00d4ff 0%, #0066ff 50%, #00d4ff 100%);
    background-size: 200% auto;
    color: #fff;
    border: none;
    padding: 3vh 5vw;
    font-size: 4vh;
    font-weight: 900;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 6px;
    text-transform: uppercase;
    box-shadow: 0 10px 40px rgba(0,102,255,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: all 0.3s;
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer { to { background-position: 200% center; } }

  .play-btn:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 20px 60px rgba(0,102,255,0.7), inset 0 1px 0 rgba(255,255,255,0.4);
  }

  .play-btn:disabled {
    background: #333;
    cursor: not-allowed;
    box-shadow: none;
    animation: none;
  }

  .reset-btn {
    background: rgba(255,60,60,0.15);
    color: #ff6b6b;
    border: 1px solid rgba(255,60,60,0.3);
    padding: 2vh 2vw;
    border-radius: 25px;
    cursor: pointer;
    font-size: 2vh;
    font-weight: 700;
    letter-spacing: 2px;
    transition: all 0.3s;
  }

  .reset-btn:hover { background: rgba(255,60,60,0.3); }

  /* Confetti */
  .confetti {
    position: fixed;
    top: -20px;
    z-index: 9999;
    pointer-events: none;
  }

  .fullscreen-hint {
    position: fixed;
    bottom: 1vh;
    right: 1vw;
    font-size: 1.5vh;
    color: rgba(255,255,255,0.3);
    z-index: 100;
  }

  /* =========================================
     MOBILE RESPONSIVE STYLES (Max Width 768px)
     ========================================= */
  @media (max-width: 768px) {
    html, body {
      overflow-y: auto;
    }
    
    .led-wall {
      grid-template-rows: auto 1fr auto;
      padding: 10px;
      gap: 10px;
      height: auto;
      min-height: 100vh;
    }

    .top-bar {
      flex-direction: column;
      gap: 5px;
      padding: 10px;
    }

    .top-bar > div:last-child {
      display: none;
    }

    .vivo-logo { font-size: 22px; }
    .launch-title h1 { font-size: 16px; letter-spacing: 1px; }
    .launch-title .tagline { font-size: 11px; }

    .center-stage {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      gap: 15px;
    }

    .product-panel {
      height: 100px;
      order: -1;
    }

    .product-image { max-height: 90%; }

    .number-stage {
      width: 55vw;
      height: 55vw;
      max-width: 240px;
      max-height: 240px;
    }

    .number-display { font-size: 16vw; }
    .draw-label { font-size: 13px; margin-bottom: 5px; }

    .winner-panel {
      padding: 15px;
      min-height: 130px;
    }

    .congrats-text { font-size: 18px; margin-bottom: 8px; }
    .lucky-number-label { font-size: 12px; }
    .lucky-number-value { font-size: 15vw; }

    .bottom-bar {
      flex-direction: column;
      gap: 12px;
      padding-bottom: 30px;
    }

    .play-btn {
      width: 90%;
      padding: 14px;
      font-size: 18px;
    }

    .reset-btn {
      position: static;
      width: 90%;
      padding: 12px;
      font-size: 14px;
      display: block !important;
    }

    .fullscreen-hint { display: none; }
  }
</style>
</head>
<body>
  <div class="bg-particles" id="bgParticles"></div>

  <div class="led-wall">
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="vivo-logo"></div>
      <div class="launch-title">
        <h1>VIVO V80 GRAND LAUNCH</h1>
        <div class="tagline">✨ Lucky Draw Contest ✨</div>
      </div>
      <div style="width: 150px;"></div> <!-- Spacer for desktop balance -->
    </div>

    <!-- CENTER STAGE -->
    <div class="center-stage">
      <!-- LEFT: Product Image -->
      <div class="product-panel">
        <img src="vivo-v80.jpeg" alt="VIVO V80" class="product-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div class="product-fallback">
          <div class="model">VIVO V80</div>
          <div class="sub">ZEISS Portrait So Pro</div>
        </div>
      </div>

      <!-- CENTER: Number Display -->
      <div class="number-panel">
        <div class="draw-label">🎯 Your Lucky Number</div>
        <div class="number-stage">
          <div class="glow-ring">
            <div class="glow-ring-inner">
              <div class="number-display" id="numberDisplay">?</div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: Winner Announcement -->
      <div class="winner-panel" id="winnerPanel">
        <div class="congrats-text">🎉🎉🎉<br>Congratulations<br>Winner<br>🎉🎉🎉</div>
        <div class="lucky-number-label">Lucky Number</div>
        <div class="lucky-number-value" id="luckyNumberValue">---</div>
      </div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
      <button class="play-btn" id="playBtn">▶ SPIN</button>
     
    </div>
  </div>

  <div class="fullscreen-hint">Press 'F' for Fullscreen</div>

<script>
  const MAX_NUMBER = 600;
  const STORAGE_KEY = 'vivo_v80_lucky_draw_responsive';

  const numberDisplay = document.getElementById('numberDisplay');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const winnerPanel = document.getElementById('winnerPanel');
  const luckyNumberValue = document.getElementById('luckyNumberValue');
  const bgParticles = document.getElementById('bgParticles');

  let winners = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let isRolling = false;

  function createBgParticles() {
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 8 + 3;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (Math.random() * 15 + 10) + 's';
      p.style.animationDelay = Math.random() * 15 + 's';
      bgParticles.appendChild(p);
    }
  }

  function saveWinners() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(winners));
  }

  function getAvailableNumbers() {
    const drawn = new Set(winners.map(w => w.number));
    const available = [];
    for (let i = 1; i <= MAX_NUMBER; i++) {
      if (!drawn.has(i)) available.push(i);
    }
    return available;
  }

  // 🌟 NEW: Smooth Deceleration Animation (Slot Machine Effect)
  function rollAnimation(finalNumber, callback) {
    isRolling = true;
    numberDisplay.classList.add('rolling');
    numberDisplay.classList.remove('winner');
    winnerPanel.classList.remove('show');
    
    let currentDelay = 50;  // Start fast (milliseconds)
    let maxDelay = 350;     // End slow (milliseconds)
    let rolls = 0;
    let minRolls = 20;      // Minimum number of spins before it's allowed to stop
    
    function rollStep() {
      // Show a random number during the roll
      numberDisplay.textContent = Math.floor(Math.random() * MAX_NUMBER) + 1;
      rolls++;
      
      // Check if we've rolled enough AND slowed down enough to stop
      if (rolls >= minRolls && currentDelay >= maxDelay) {
        // Stop rolling and reveal the winner!
        numberDisplay.classList.remove('rolling');
        numberDisplay.textContent = String(finalNumber).padStart(3, '0');
        numberDisplay.classList.add('winner');
        isRolling = false;
        callback();
      } else {
        // Gradually increase the delay to create the slowing-down effect
        currentDelay += 15;
        setTimeout(rollStep, currentDelay);
      }
    }
    
    // Start the rolling sequence
    setTimeout(rollStep, currentDelay);
  }

  function launchConfetti() {
    const colors = ['#00d4ff', '#0066ff', '#ffffff', '#ffcc00', '#ff6b6b', '#4ade80', '#ff00aa'];
    for (let i = 0; i < 200; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      const size = Math.random() * 16 + 8;
      c.style.width = size + 'px';
      c.style.height = size + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.boxShadow = `0 0 ${size}px ${c.style.background}`;
      document.body.appendChild(c);

      const duration = Math.random() * 3 + 2.5;
      const drift = (Math.random() - 0.5) * 500;
      c.animate([
        { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${drift}px, 100vh) rotate(${Math.random()*1080}deg)`, opacity: 0 }
      ], { duration: duration * 3000, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' });

      setTimeout(() => c.remove(), duration * 3000);
    }
  }

  function showWinnerAnnouncement(number) {
    luckyNumberValue.textContent = String(number).padStart(3, '0');
    winnerPanel.classList.add('show');
  }

  playBtn.addEventListener('click', () => {
    if (isRolling) return;
    const available = getAvailableNumbers();
    if (available.length === 0) {
      alert('All 600 numbers have been drawn! Please reset to start again.');
      return;
    }

    playBtn.disabled = true;
    const randomIndex = Math.floor(Math.random() * available.length);
    const winningNumber = available[randomIndex];

    rollAnimation(winningNumber, () => {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      winners.push({ number: winningNumber, time: timeStr });
      saveWinners();
      showWinnerAnnouncement(winningNumber);
      launchConfetti();
      playBtn.disabled = false;

      if (winners.length >= MAX_NUMBER) {
        playBtn.disabled = true;
        setTimeout(() => alert('🎉 All numbers drawn! Contest complete.'), 500);
      }
    });
  });

  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      if (winners.length === 0) return;
      if (confirm('Are you sure you want to reset all winners? This cannot be undone.')) {
        winners = [];
        saveWinners();
        numberDisplay.textContent = '?';
        numberDisplay.classList.remove('winner');
        winnerPanel.classList.remove('show');
        playBtn.disabled = false;
      }
    });
  }

  // Press 'F' for fullscreen
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }
  });

  // Init
  createBgParticles();
</script>
</body>
</html>
